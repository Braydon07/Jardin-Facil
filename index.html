<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JardínFácil</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#F6F1E4;--card:#fff;--tx:#23301f;--mut:#6b7566;--g:#2F7D4F;--gd:#1E4D34;--sun:#F2B93B;--terra:#D9793B;--bd:#e4dcc6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15201a;--card:#1f2d25;--tx:#eef1e6;--mut:#a3b09f;--bd:#2f4036}}
:root[data-theme="dark"]{--bg:#15201a;--card:#1f2d25;--tx:#eef1e6;--mut:#a3b09f;--bd:#2f4036}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Nunito",system-ui,-apple-system,Segoe UI,sans-serif;max-width:520px;margin:auto;padding-bottom:80px}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--gd);color:#fff}
header b{font-size:1.3rem}header small{display:block;opacity:.8;font-size:.75rem}
main{padding:14px}
h2{margin:6px 0 10px;font-size:1.15rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1}
.emo{font-size:2rem}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--bd);margin-right:4px}
.tag.w{background:#cfe6f7;color:#124}.tag.u{background:var(--terra);color:#fff}.tag.p{background:#e6d3f0;color:#3a1c4a}
button,select,input{font:inherit}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:9px 14px;cursor:pointer}
.btn.s{background:var(--sun);color:#3a2a00}.btn.o{background:transparent;color:var(--g);border:1px solid var(--g)}
select,input[type=text]{width:100%;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:4px 0 10px}
label{font-size:.85rem;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:10px 0;color:var(--mut);cursor:pointer;font-size:.72rem}
nav button span{display:block;font-size:1.4rem}nav button.on{color:var(--g);font-weight:700}
.sym{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sym button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 12px;cursor:pointer}
.sym button.on{background:var(--g);color:#fff;border-color:var(--g)}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.hi{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;border:0}
</style>
</head>
<body>
<header>
<svg width="46" height="46" viewBox="0 0 100 100" aria-label="Logo JardínFácil"><circle cx="50" cy="50" r="48" fill="#F6F1E4"/><circle cx="72" cy="28" r="11" fill="#F2B93B"/><path d="M50 84V52" stroke="#1E4D34" stroke-width="6" stroke-linecap="round"/><path d="M50 56C50 38 34 30 20 32c0 16 12 26 30 24z" fill="#2F7D4F"/><path d="M50 50C50 34 62 26 78 28c0 15-12 24-28 22z" fill="#4CA36C"/><path d="M30 86h40" stroke="#D9793B" stroke-width="6" stroke-linecap="round"/></svg>
<div><b>JardínFácil</b><small>Tu asistente de jardinería personal</small></div>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const P=[
{id:'ger',n:'Geranio',e:'🌺',sun:'sol',w:3,prune:[3,10],pn:'Despunta flores marchitas y poda ligera',tip:'Odia el encharcamiento.'},
{id:'lav',n:'Lavanda',e:'💜',sun:'sol',w:7,prune:[3,9],pn:'Poda tras la floración, sin cortar madera vieja',tip:'Suelo drenante y poca agua.'},
{id:'ros',n:'Rosal',e:'🌹',sun:'sol',w:4,prune:[1,2],pn:'Poda fuerte a 3-5 yemas',tip:'Riega al pie, sin mojar hojas.'},
{id:'oli',n:'Olivo',e:'🫒',sun:'sol',w:14,prune:[2,3],pn:'Aclara ramas interiores',tip:'Muy resistente a la sequía.'},
{id:'men',n:'Hierbabuena',e:'🌿',sun:'semi',w:2,prune:[4,5,6,7,8],pn:'Pellizca puntas para que ramifique',tip:'Necesita humedad constante.'},
{id:'tom',n:'Tomatera',e:'🍅',sun:'sol',w:2,prune:[5,6,7],pn:'Quita chupones laterales',tip:'Riego regular y abono en floración.'},
{id:'hor',n:'Hortensia',e:'💠',sun:'semi',w:3,prune:[2,3],pn:'Corta flores secas sobre yema sana',tip:'Prefiere semisombra y agua sin cal.'},
{id:'hel',n:'Helecho',e:'🍃',sun:'sombra',w:3,prune:[3],pn:'Retira frondas secas',tip:'Ambiente húmedo, nunca sol directo.'}];
const D=[
{k:'Hojas amarillas',c:'Exceso de riego o falta de nutrientes',f:'Espacia el riego, comprueba drenaje y aporta abono equilibrado.'},
{k:'Puntas marrones',c:'Falta de agua o sol excesivo',f:'Riega más profundo y mueve la planta a semisombra.'},
{k:'Polvo blanco en hojas',c:'Oídio (hongo)',f:'Retira hojas afectadas, mejora ventilación, aplica azufre o bicarbonato diluido.'},
{k:'Hojas caídas',c:'Sed o raíces encharcadas',f:'Toca la tierra: si está seca riega; si está húmeda, deja secar.'},
{k:'Bichitos pegajosos',c:'Pulgón',f:'Chorro de agua, jabón potásico o atrae mariquitas.'},
{k:'Hojas con agujeros',c:'Orugas o caracoles',f:'Revisa al anochecer, retíralos a mano o usa Bacillus thuringiensis.'},
{k:'Manchas negras',c:'Hongo (mancha negra)',f:'Elimina hojas, evita mojar el follaje y trata con cobre.'}];
let S={plants:[],zone:'sol'},tab='hoy',sel=[];
try{const r=localStorage.getItem('jf');if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem('jf',JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
const days=d=>Math.floor((new Date(today())-new Date(d))/864e5);
const pl=id=>P.find(x=>x.id===id);
function interval(i){const p=pl(i.pid),m=new Date().getMonth()+1;let f=1;
 if([6,7,8].includes(m))f*=.7;else if([12,1,2].includes(m))f*=1.6;
 if(i.pot)f*=.8;if(i.zone==='sol'&&p.sun!=='sol')f*=.8;if(i.zone==='sombra')f*=1.2;
 return Math.max(1,Math.round(p.w*f));}
const ZN={sol:'☀️ Sol',semi:'⛅ Semisombra',sombra:'🌥️ Sombra'};
function tasks(){const t=[],m=new Date().getMonth()+1;
 S.plants.forEach(i=>{const p=pl(i.pid),iv=interval(i),d=days(i.last);
  if(d>=iv)t.push({i,p,type:'w',late:d-iv});
  if(p.prune.includes(m))t.push({i,p,type:'p'});});
 return t;}
function water(id){const i=S.plants.find(x=>x.id===id);i.last=today();save();render();}
function del(id){S.plants=S.plants.filter(x=>x.id!==id);save();render();}
function add(){const pid=v('pp'),z=v('zz'),pot=v('pt')==='1',nick=v('nk')||pl(pid).n;
 S.plants.push({id:Date.now()+'',pid,zone:z,pot,nick,last:today()});save();tab='jardin';render();}
const v=id=>document.getElementById(id).value;
function card(t){const{i,p}=t;return `<div class="card row"><div class="emo">${p.e}</div><div class="grow"><b>${i.nick}</b><br>${t.type==='w'?`<span class="tag w">💧 Regar${t.late?` (+${t.late} d)`:''}</span>`:`<span class="tag p">✂️ Podar</span> <small>${p.pn}</small>`}</div>${t.type==='w'?`<button class="btn" onclick="water('${i.id}')">Hecho</button>`:''}</div>`}
const V={
hoy(){const t=tasks();const m=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][new Date().getMonth()];
 return `<div class="card hi"><b>¡Hola, jardinero! 🌱</b><br>Hoy es ${new Date().getDate()} de ${m}. ${t.length?`Tienes <b>${t.length}</b> tarea(s) pendiente(s).`:'Todo al día, tu jardín está feliz.'}</div><h2>Tareas de hoy</h2>`+
 (S.plants.length?(t.length?t.map(card).join(''):'<div class="empty">✅ Nada pendiente</div>'):'<div class="empty">Aún no tienes plantas.<br><br><button class="btn" onclick="go(\'add\')">Añadir mi primera planta</button></div>')},
jardin(){return `<h2>Mi jardín (${S.plants.length})</h2>`+(S.plants.length?S.plants.map(i=>{const p=pl(i.pid),iv=interval(i),d=days(i.last);
 return `<div class="card"><div class="row"><div class="emo">${p.e}</div><div class="grow"><b>${i.nick}</b><br><span class="tag">${ZN[i.zone]}</span><span class="tag">${i.pot?'Maceta':'Suelo'}</span></div><button class="btn o" onclick="del('${i.id}')">✕</button></div>
 <p style="margin:8px 0"><small>💧 Riega cada <b>${iv}</b> días · último riego hace ${d} d<br>✂️ Poda: ${p.pn}<br>💡 ${p.tip}</small></p><button class="btn s" onclick="water('${i.id}')">💧 Regada hoy</button></div>`}).join(''):'<div class="empty">Vacío. Añade tu primera planta.</div>')},
add(){return `<h2>Añadir planta</h2><div class="card"><label>Planta</label><select id="pp">${P.map(p=>`<option value="${p.id}">${p.e} ${p.n}</option>`).join('')}</select>
<label>Nombre (opcional)</label><input type="text" id="nk" placeholder="Ej: Rosal de la entrada">
<label>Cuánto sol recibe</label><select id="zz"><option value="sol">☀️ Sol directo</option><option value="semi">⛅ Semisombra</option><option value="sombra">🌥️ Sombra</option></select>
<label>Dónde está</label><select id="pt"><option value="0">En el suelo</option><option value="1">En maceta</option></select>
<button class="btn" onclick="add()">Guardar planta</button></div>`},
diag(){const r=D.filter(d=>sel.includes(d.k));
 return `<h2>🔍 Diagnóstico</h2><p><small>Marca lo que ves en tu planta:</small></p><div class="sym">${D.map(d=>`<button class="${sel.includes(d.k)?'on':''}" onclick="tg('${d.k}')">${d.k}</button>`).join('')}</div>`+
 r.map(d=>`<div class="card"><b>⚠️ ${d.c}</b><br><small>${d.f}</small></div>`).join('')}};
function tg(k){sel=sel.includes(k)?sel.filter(x=>x!==k):[...sel,k];render();}
function go(t){tab=t;render();}
function render(){document.getElementById('app').innerHTML=V[tab]();
 const N=[['hoy','🏡','Hoy'],['jardin','🪴','Mi jardín'],['add','➕','Añadir'],['diag','🔍','Diagnóstico']];
 document.getElementById('nav').innerHTML=N.map(n=>`<button class="${tab===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');}
render();
</script>
</body>
</html>
